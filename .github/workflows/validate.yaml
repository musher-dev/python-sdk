name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      devcontainer: ${{ steps.filter.outputs.devcontainer }}
      scripts: ${{ steps.filter.outputs.scripts }}
      compose: ${{ steps.filter.outputs.compose }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          # devcontainer: what the dev container is built from (everything
          # under .devcontainer/) and this workflow, which holds the job that
          # builds it, so a change to that job runs it too.
          filters: |
            devcontainer:
              - '.devcontainer/**'
              - '.github/workflows/validate.yaml'
            scripts:
              - '.devcontainer/scripts/**'
            compose:
              - '.devcontainer/compose.yaml'
              - '.devcontainer/compose/**'
              - '.devcontainer/.env.example'

  shellcheck:
    name: ShellCheck
    needs: changes
    if: needs.changes.outputs.scripts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: .devcontainer/scripts
          severity: warning

  compose:
    name: Compose Config
    needs: changes
    if: needs.changes.outputs.compose == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate compose config
        run: |
          cp .devcontainer/.env.example .devcontainer/.env
          docker compose -f .devcontainer/compose.yaml config --quiet

  build:
    name: Devcontainer Build
    needs: changes
    if: needs.changes.outputs.devcontainer == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build devcontainer
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3.1900000450
        with:
          cacheFrom: ghcr.io/${{ github.repository }}-devcontainer
          # Runs after post-create, inside the container: the SDK imports
          # from the environment post-create's `uv sync` built.
          runCmd: .venv/bin/python -c 'import musher'

  # Always-pass job for branch protection required checks. It waits on
  # changes too: when that job fails, every job that needs it is skipped, and
  # a scope nobody decided must not read as nothing to check.
  validate-status:
    name: Validate Status
    if: always()
    needs: [changes, shellcheck, compose, build]
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        env:
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          if [[ "$FAILED" == "true" ]]; then
            echo "One or more validation jobs failed or were cancelled"
            exit 1
          fi
          echo "All validation checks passed (or were skipped due to no relevant changes)"
